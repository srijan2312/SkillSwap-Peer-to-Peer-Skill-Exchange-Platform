# Minimal Docker Compose setup: MongoDB + API + React frontend.
# Run with: docker compose up --build
# Then open http://localhost (frontend) — it talks to the API at http://localhost:5000.
# Seed demo data with: docker compose exec server npm run seed

services:
  mongo:
    image: mongo:8
    container_name: skillswap-mongo
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"

  server:
    build: ./server
    container_name: skillswap-server
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/skillswap
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      JWT_EXPIRE: 7d
      CLIENT_URL: http://localhost
    ports:
      - "5000:5000"

  client:
    build: ./client
    container_name: skillswap-client
    depends_on:
      - server
    ports:
      - "80:80"

volumes:
  mongo-data:
